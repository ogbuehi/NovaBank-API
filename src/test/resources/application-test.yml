spring:

  jpa:
    hibernate:
      ddl-auto: create-drop

  datasource:
    url: jdbc:h2:mem:novabank;MODE=PostgreSQL;NON_KEYWORDS=TRANSACTION;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: never

jwt:
  secret: 0123456789012345678901234567890123456789012345678901234567890123
  expiration: 86400000


